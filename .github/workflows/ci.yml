name: Extension checks
on:
  push:
  pull_request:
jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '24'
      - name: Check JavaScript syntax
        run: |
          node --check extension/core/settings.js
          node --check extension/core/contrast.js
          node --check extension/background.js
          node --check extension/content.js
          node --check extension/popup.js
      - name: Run unit and browser tests
        run: node tests/extension.test.js
      - name: Build upload archive
        run: python3 scripts/package-extension.py
