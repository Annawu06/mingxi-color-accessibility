<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>明晰</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <header><div class="brand"><span>◒</span><strong>明晰</strong></div><small>色彩友好浏览</small></header>
    <main>
      <div class="site-name" id="siteName">当前网站</div>
      <div class="toggle-row"><div><strong>色彩友好模式</strong><p id="status">当前页面未启用</p></div><button class="switch" id="enabled" role="switch" aria-checked="false"><i></i></button></div>
      <div class="divider"></div>
      <label class="label">选择你的视觉模式</label>
      <div class="modes">
        <button data-mode="protanopia"><span class="swatch red"></span>红色辨识优化</button>
        <button data-mode="deuteranopia"><span class="swatch green"></span>绿色辨识优化</button>
        <button data-mode="tritanopia"><span class="swatch blue"></span>蓝黄色辨识优化</button>
        <button data-mode="contrast"><span class="swatch black"></span>高对比度模式</button>
      </div>
      <label class="range-label" for="intensity"><span>滤镜强度</span><output id="intensityValue">75%</output></label><input id="intensity" type="range" min="0" max="100" step="5" value="75">
      <label class="range-label" for="fontScale"><span>网页字体大小</span><output id="fontScaleValue">100%</output></label><input id="fontScale" type="range" min="100" max="160" step="5" value="100">
      <div class="checks"><label><input id="colorRemap" type="checkbox" checked> 颜色重映射（辅助）</label><label><input id="autoContrast" type="checkbox" checked> 自动提高文字对比度</label><label><input id="semanticHints" type="checkbox" checked> 增加图标和文字提示</label><label><input id="enhanceImages" type="checkbox" checked> 增强图片、图表和视频</label><label><input id="linkHints" type="checkbox" checked> 给链接增加下划线提示</label><label><input id="requiredHints" type="checkbox" checked> 给必填项增加文字提示</label><label><input id="focusHints" type="checkbox" checked> 强化键盘焦点提示</label></div>
      <div class="tools"><button id="probe" type="button">色彩探针</button><button id="reader" type="button">黑白阅读</button><button id="exclude" type="button">排除本站</button></div><button class="shortcut-button" id="shortcuts" type="button">设置快捷键（Alt + Shift + S）</button>
      <details class="advanced"><summary>高级：自定义颜色映射</summary><div class="mapping-row"><input id="mapFrom" type="color" value="#E00000" aria-label="原颜色"><span>→</span><input id="mapTo" type="color" value="#D97706" aria-label="替换颜色"><button id="addMapping" type="button">添加</button></div><div id="mappingList" class="mapping-list">暂未添加规则</div></details>
      <button class="test-button" id="openTest" type="button">体验色彩图案辨认 <span>→</span></button>
      <p class="hint">ⓘ 设置会按网站保存。图案体验不是标准化色觉检查，不能判断色觉类型。</p>
      <div class="feedback"><strong>完成任务后反馈</strong><span>你的反馈只保存在本机</span><button data-feedback="success">我能区分状态</button><button data-feedback="chart">我能读懂图表</button><button data-feedback="link">我能找到链接</button><small id="feedbackSummary">还没有记录</small></div>
      <div class="utility-row"><button class="reset-button" id="audit" type="button">诊断当前页面</button><button class="reset-button" id="stats" type="button">使用统计</button></div><section class="audit-results" id="auditResults" hidden aria-live="polite"><strong>文字对比度诊断</strong><p id="auditSummary"></p><ul id="auditExamples"></ul><button class="reset-button" id="fixContrast" type="button">自动提高文字对比度</button><button class="reset-button" id="auditExport" type="button">导出 JSON 报告</button><small>基于可计算的纯色背景进行启发式检查；图片、渐变和遮挡可能影响实际结果。</small></section><button class="reset-button" id="resetSite" type="button">重置当前网站设置</button><div class="utility-row"><button class="reset-button" id="settingsExport" type="button">导出全部设置</button><button class="reset-button" id="settingsImport" type="button">导入设置</button><input id="settingsFile" type="file" accept="application/json" hidden></div><button class="reset-button" id="dataTools" type="button">导出 / 清除本地反馈</button>
    </main>
    <section class="test-panel" id="testPanel" hidden><button class="close" id="closeTest">×</button><p class="label">色彩图案体验 <span id="questionNo">1 / 3</span></p><h2 id="testQuestion">你能看见圆点中的数字吗？</h2><canvas class="ishihara" id="ishihara" width="290" height="290" aria-label="色彩图案点阵图"></canvas><div class="test-actions"><button id="canSee">看得见</button><button id="cannotSee">看不清</button></div><p id="testResult" class="result"></p><p class="attribution">参考 <a href="https://opticquiz.com/research/" target="_blank">OpticQuiz PPPG</a>，CC BY 4.0。非标准化演示，不具有医学筛查效力。</p></section>
    <footer>明晰让信息不再被颜色阻挡。</footer>
    <script src="core/settings.js"></script><script src="popup.js"></script>
  </body>
</html>
