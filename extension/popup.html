<!doctype html>
<html lang="zh-CN">
  <head><meta charset="UTF-8"><meta name="viewport" content="width=device-width, initial-scale=1"><title>明晰</title><link rel="stylesheet" href="popup.css"></head>
  <body>
    <header><div class="brand"><span>◒</span><strong>明晰</strong></div><small>色彩友好浏览</small></header>
    <main>
      <div class="site-name" id="siteName">当前网站</div>
      <div class="toggle-row"><div><strong>色彩友好模式</strong><p id="status">当前页面未启用</p></div><button class="switch" id="enabled" role="switch" aria-checked="false"><i></i></button></div>
      <div class="divider"></div>
      <label class="label">选择你的视觉模式</label>
      <div class="modes">
        <button data-mode="protanopia"><span class="swatch red"></span>红色辨识优化</button>
        <button data-mode="deuteranopia"><span class="swatch green"></span>绿色辨识优化</button>
        <button data-mode="tritanopia"><span class="swatch blue"></span>蓝黄色辨识优化</button>
        <button data-mode="contrast"><span class="swatch black"></span>高对比度模式</button>
      </div>
      <label class="range-label" for="intensity"><span>滤镜强度</span><output id="intensityValue">75%</output></label><input id="intensity" type="range" min="0" max="100" step="5" value="75">
      <div class="checks"><label><input id="colorRemap" type="checkbox" checked> 颜色重映射（辅助）</label><label><input id="autoContrast" type="checkbox" checked> 自动提高文字对比度</label><label><input id="semanticHints" type="checkbox" checked> 增加图标和文字提示</label><label><input id="enhanceImages" type="checkbox" checked> 增强图片与图表</label><label><input id="linkHints" type="checkbox" checked> 给链接增加下划线提示</label></div>
      <button class="test-button" id="openTest" type="button">开始新手色觉自测 <span>→</span></button>
      <p class="hint">ⓘ 设置会按网站保存。自测仅用于推荐设置，不构成医学诊断。</p>
      <div class="feedback"><strong>完成任务后反馈</strong><span>你的反馈只保存在本机</span><button data-feedback="success">我能区分状态</button><button data-feedback="chart">我能读懂图表</button><button data-feedback="link">我能找到链接</button></div>
      <button class="reset-button" id="resetSite" type="button">重置当前网站设置</button>
    </main>
    <section class="test-panel" id="testPanel" hidden><button class="close" id="closeTest">×</button><p class="label">快速自测 <span id="questionNo">1 / 3</span></p><h2 id="testQuestion">你能看见圆点中的数字吗？</h2><canvas class="ishihara" id="ishihara" width="290" height="290" aria-label="色觉自测点阵图"></canvas><div class="test-actions"><button id="canSee">看得见</button><button id="cannotSee">看不清</button></div><p id="testResult" class="result"></p><p class="attribution">测试方法参考 <a href="https://opticquiz.com/research/" target="_blank">OpticQuiz PPPG</a>，CC BY 4.0。仅供非医疗筛查。</p></section>
    <footer>明晰让信息不再被颜色阻挡。</footer>
    <script src="popup.js"></script>
  </body>
</html>
